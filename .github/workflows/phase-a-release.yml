name: Phase A Weekly Release

on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force artifact and changelog generation even when canonical hashes match"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phase-a-release
  cancel-in-progress: false

jobs:
  release-phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_RUN: ${{ inputs.force_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run offline quality gates
        run: |
          set -euo pipefail
          uv run --offline ruff check
          uv run --offline ruff format --check
          uv run --offline basedpyright
          uv run --offline pytest -q --tb=short

      - name: Fetch live European FX & Tier 1 fuel prices
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          CNE_API_TOKEN: ${{ secrets.CNE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          uv run --offline ets2-realism fetch --lock-path state/prices.lock.json --json > dist/fetch_summary.json

      - name: Publish fetch alert summary to step summary
        run: |
          set -euo pipefail
          uv run --offline python - <<'PY'
          import json
          import os
          import pathlib

          from ets2_realism.normalize.currencies import EXTENDED_GLOBAL_CURRENCIES

          def _sanitize(text: str, limit: int = 240) -> str:
              cleaned = (
                  " ".join(text.split())
                  .replace("`", "'")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace("|", "\\|")
                  .replace("[", "\\[")
                  .replace("]", "\\]")
              )
              return cleaned[:limit].rstrip("\\")

          def _is_ext_fx_warn(alert: dict) -> bool:
              return (
                  str(alert.get("severity", "")).lower() == "warning"
                  and str(alert.get("code", "")).startswith("fx_")
                  and str(alert.get("scope", "")) in EXTENDED_GLOBAL_CURRENCIES
              )

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          summary_path = pathlib.Path("dist/fetch_summary.json")
          if step_summary and summary_path.is_file():
              fetch_data = json.loads(summary_path.read_text("utf-8"))
              alerts = fetch_data.get("alerts", [])
              eu_ok = fetch_data.get("eu_tier1_feeds_succeeded", fetch_data.get("tier1_feeds_succeeded", 0))
              eu_fail = fetch_data.get("eu_tier1_feeds_failed", fetch_data.get("tier1_feeds_failed", 0))
              global_ok = fetch_data.get("global_tier1_feeds_succeeded", 0)
              global_fail = fetch_data.get("global_tier1_feeds_failed", 0)
              tier2_ok = fetch_data.get("tier2_feeds_succeeded", 0)
              tier2_fail = fetch_data.get("tier2_feeds_failed", 0)
              tier3_stale = [a for a in alerts if a.get("code") == "stale_tier3_curated"]
              ext_fx_warnings = [a for a in alerts if _is_ext_fx_warn(a)]
              roll_up_ext_fx = len(ext_fx_warnings) > 5
              itemized_alerts = [
                  a
                  for a in alerts
                  if a.get("code") != "stale_tier3_curated"
                  and not (roll_up_ext_fx and _is_ext_fx_warn(a))
              ]
              lines = [
                  "### Phase A Fetch Summary",
                  "",
                  f"- **EU Core Tier 1 Feeds Succeeded / Failed:** `{eu_ok}` / `{eu_fail}`",
                  f"- **Global Tier 1 Feeds Succeeded / Failed:** `{global_ok}` / `{global_fail}`",
                  f"- **Tier 2 National Portals Succeeded / Failed:** `{tier2_ok}` / `{tier2_fail}`",
                  f"- **Countries Updated / Fallback:** `{fetch_data.get('countries_updated', 0)}` / `{fetch_data.get('countries_fallback', 0)}`",
                  f"- **Alerts:** `{len(alerts)}`",
              ]
              if itemized_alerts or tier3_stale or (roll_up_ext_fx and ext_fx_warnings):
                  lines.extend(["", "#### Circuit-Breaker & Staleness Alerts"])
                  for alert in itemized_alerts:
                      sev = _sanitize(str(alert.get("severity", "warning")).upper(), 32)
                      code = _sanitize(str(alert.get("code", "alert")), 64)
                      scope = _sanitize(str(alert.get("scope", "global")), 64)
                      detail = _sanitize(str(alert.get("detail", "")), 240)
                      lines.append(f"- **[{sev}] `{code}` (`{scope}`):** {detail}")
                  if roll_up_ext_fx and ext_fx_warnings:
                      counts: dict[str, int] = {}
                      for alert in ext_fx_warnings:
                          c = str(alert.get("code", "fx_alert"))
                          counts[c] = counts.get(c, 0) + 1
                      breakdown = ", ".join(
                          f"`{_sanitize(c, 64)}`={n}" for c, n in sorted(counts.items())
                      )
                      lines.append(
                          f"- **[WARNING] `extended_fx_alerts` (`extended_fx`):** "
                          f"`{len(ext_fx_warnings)}` extended global FX warning alerts ({breakdown})."
                      )
                  if tier3_stale:
                      lines.append(
                          f"- **[WARNING] `stale_tier3_curated` (`tier3`):** `{len(tier3_stale)}` "
                          "Tier 3 curated baseline territories overdue (>180d)."
                      )
              with pathlib.Path(step_summary).open("a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          PY

      - name: Run Phase A diff-gated release build
        id: release
        run: |
          set -euo pipefail
          args=(
            --state state/published.json
            --prices-lock state/prices.lock.json
            --out-dir dist
            --changelogs-dir .
            --write-state
          )
          if [ "${FORCE_RUN:-false}" = "true" ]; then
            args+=(--force)
          fi
          uv run --offline ets2-realism publish release "${args[@]}"
          uv run --offline python - <<'PY'
          import json, os, pathlib

          summary = json.loads(pathlib.Path("dist/release_summary.json").read_text("utf-8"))
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"any_changed={str(summary['any_changed']).lower()}\n")
              fh.write(f"snapshots_changed={str(summary['snapshots_changed']).lower()}\n")
              fh.write(f"summer_changed={str(summary['summer_changed']).lower()}\n")
              fh.write(f"winter_changed={str(summary['winter_changed']).lower()}\n")
              fh.write(f"changed_editions={','.join(summary['changed_editions'])}\n")
              fh.write(f"force_run={str(summary['force_run']).lower()}\n")
          PY

      - name: Run explicit Offline SCS Workshop Validator checks
        run: |
          set -euo pipefail
          uv run --offline ets2-realism validate workshop dist/workshop/summer
          uv run --offline ets2-realism validate workshop dist/workshop/winter
          uv run --offline ets2-realism validate local dist/local/ETS2_Country_Realism_Core_Summer.zip
          uv run --offline ets2-realism validate local dist/local/ETS2_Country_Realism_Core_Winter.zip

      - name: Verify v1 realism snapshots and SHA256SUMS manifest
        run: |
          set -euo pipefail
          uv run --offline ets2-realism registry snapshot-verify dist/snapshots/realism-snapshot-summer.json --checksums dist/snapshots/SHA256SUMS.txt --expected-edition summer
          uv run --offline ets2-realism registry snapshot-verify dist/snapshots/realism-snapshot-winter.json --checksums dist/snapshots/SHA256SUMS.txt --expected-edition winter

      - name: Log clean no-op exit when nothing changed
        if: steps.release.outputs.any_changed != 'true' && steps.release.outputs.snapshots_changed != 'true' && env.FORCE_RUN != 'true' && steps.release.outputs.force_run != 'true'
        run: echo "No canonical content or snapshot changes detected for Summer or Winter; exiting cleanly as no-op."

      - name: Upload validated Phase A release artifacts
        if: steps.release.outputs.any_changed == 'true' || steps.release.outputs.snapshots_changed == 'true' || env.FORCE_RUN == 'true' || steps.release.outputs.force_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-release-bundle
          if-no-files-found: ignore
          path: |
            dist/workshop
            dist/local
            dist/snapshots
            dist/fetch_summary.json
            dist/release_summary.json
            CHANGELOG_SUMMER.md
            CHANGELOG_WINTER.md

      - name: Publish rolling public snapshots-latest GitHub Release
        if: (steps.release.outputs.any_changed == 'true' || steps.release.outputs.snapshots_changed == 'true' || env.FORCE_RUN == 'true' || steps.release.outputs.force_run == 'true') && (github.event_name == 'schedule' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="snapshots-latest"
          TITLE="Latest Realism Snapshots (schema_version=1)"
          NOTES="Automated rolling public release of verified schema_version=1 summer/winter realism snapshots and SHA256SUMS.txt for offline ProMods Companion Builder and ets2-realism compose-local."
          ASSETS=(
            dist/snapshots/realism-snapshot-summer.json
            dist/snapshots/realism-snapshot-winter.json
            dist/snapshots/SHA256SUMS.txt
          )
          API_ERR=$(mktemp)
          trap 'rm -f "$API_ERR"' EXIT
          HTTP_STATUS=""
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --silent 2>"$API_ERR"; then
            HTTP_STATUS="200"
          elif grep -q "HTTP 404" "$API_ERR"; then
            HTTP_STATUS="404"
          else
            cat "$API_ERR" >&2
            exit 1
          fi
          if [ "$HTTP_STATUS" = "200" ]; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Create or update persistent Release PR
        if: (steps.release.outputs.any_changed == 'true' || steps.release.outputs.snapshots_changed == 'true') && (github.event_name == 'schedule' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_EDITIONS: ${{ steps.release.outputs.changed_editions }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in state/published.json state/prices.lock.json CHANGELOG_SUMMER.md CHANGELOG_WINTER.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "No staged release ledger or changelog changes to commit."
            exit 0
          fi

          git commit -m "chore(release): phase A weekly update (${CHANGED_EDITIONS:-none})"
          git push --force origin HEAD:release/phase-a-weekly

          PR_TITLE="chore(release): Phase A weekly Core bundle update (${CHANGED_EDITIONS:-none})"
          PR_BODY=$(uv run --offline python - <<'PY'
          import json
          import pathlib

          lines = [
              "Automated Phase A semi-auto release update generated by `phase-a-release.yml`.",
              "",
              "### Maintainer Handoff Checklist (Manual SCS Workshop Uploader — AppID 421800)",
              "1. Download the `phase-a-release-bundle` workflow artifact from this run.",
              "2. Upload the validated `dist/workshop/summer/` and/or `dist/workshop/winter/` directories using **SCS Workshop Uploader**.",
              "3. Merge this persistent Release PR only **after** Workshop upload completes so `state/published.json` and `state/prices.lock.json` advance on `master`.",
          ]

          summary_path = pathlib.Path("dist/fetch_summary.json")
          if summary_path.is_file():
              from ets2_realism.normalize.currencies import EXTENDED_GLOBAL_CURRENCIES

              def _sanitize(text: str, limit: int = 240) -> str:
                  cleaned = (
                      " ".join(text.split())
                      .replace("`", "'")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                      .replace("|", "\\|")
                      .replace("[", "\\[")
                      .replace("]", "\\]")
                  )
                  return cleaned[:limit].rstrip("\\")

              def _is_ext_fx_warn(alert: dict) -> bool:
                  return (
                      str(alert.get("severity", "")).lower() == "warning"
                      and str(alert.get("code", "")).startswith("fx_")
                      and str(alert.get("scope", "")) in EXTENDED_GLOBAL_CURRENCIES
                  )

              fetch_data = json.loads(summary_path.read_text("utf-8"))
              alerts = fetch_data.get("alerts", [])
              tier3_stale = [a for a in alerts if a.get("code") == "stale_tier3_curated"]
              ext_fx_warnings = [a for a in alerts if _is_ext_fx_warn(a)]
              roll_up_ext_fx = len(ext_fx_warnings) > 5
              itemized_alerts = [
                  a
                  for a in alerts
                  if a.get("code") != "stale_tier3_curated"
                  and not (roll_up_ext_fx and _is_ext_fx_warn(a))
              ]
              if itemized_alerts or tier3_stale or (roll_up_ext_fx and ext_fx_warnings):
                  lines.extend(["", "### Circuit-Breaker & Staleness Alerts"])
                  for alert in itemized_alerts:
                      sev = _sanitize(str(alert.get("severity", "warning")).upper(), 32)
                      code = _sanitize(str(alert.get("code", "alert")), 64)
                      scope = _sanitize(str(alert.get("scope", "global")), 64)
                      detail = _sanitize(str(alert.get("detail", "")), 240)
                      lines.append(f"- **[{sev}] `{code}` (`{scope}`):** {detail}")
                  if roll_up_ext_fx and ext_fx_warnings:
                      counts: dict[str, int] = {}
                      for alert in ext_fx_warnings:
                          c = str(alert.get("code", "fx_alert"))
                          counts[c] = counts.get(c, 0) + 1
                      breakdown = ", ".join(
                          f"`{_sanitize(c, 64)}`={n}" for c, n in sorted(counts.items())
                      )
                      lines.append(
                          f"- **[WARNING] `extended_fx_alerts` (`extended_fx`):** "
                          f"`{len(ext_fx_warnings)}` extended global FX warning alerts ({breakdown})."
                      )
                  if tier3_stale:
                      lines.append(
                          f"- **[WARNING] `stale_tier3_curated` (`tier3`):** `{len(tier3_stale)}` "
                          "Tier 3 curated baseline territories overdue (>180d)."
                      )

          print("\n".join(lines))
          PY
          )

          EXISTING_PR=$(gh pr list --base master --head release/phase-a-weekly --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --base master --head release/phase-a-weekly --title "$PR_TITLE" --body "$PR_BODY"
          fi

name: Phase A Weekly Release

on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force artifact and changelog generation even when canonical hashes match"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phase-a-release
  cancel-in-progress: false

jobs:
  release-phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_RUN: ${{ inputs.force_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run offline quality gates
        run: |
          set -euo pipefail
          uv run --offline ruff check
          uv run --offline ruff format --check
          uv run --offline basedpyright
          uv run --offline pytest -q --tb=short

      - name: Fetch live European FX & Tier 1 fuel prices
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          uv run --offline ets2v2 fetch --lock-path state/prices.lock.json --json > dist/fetch_summary.json

      - name: Publish fetch alert summary to step summary
        run: |
          set -euo pipefail
          uv run --offline python - <<'PY'
          import json
          import os
          import pathlib

          def _sanitize(text: str, limit: int = 240) -> str:
              cleaned = " ".join(text.split()).replace("`", "'").replace("<", "&lt;").replace(">", "&gt;")
              return cleaned[:limit]

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          summary_path = pathlib.Path("dist/fetch_summary.json")
          if step_summary and summary_path.is_file():
              fetch_data = json.loads(summary_path.read_text("utf-8"))
              alerts = fetch_data.get("alerts", [])
              lines = [
                  "### Phase A Fetch Summary",
                  "",
                  f"- **Tier 1 Feeds Succeeded:** `{fetch_data.get('tier1_feeds_succeeded', 0)}`",
                  f"- **Tier 1 Feeds Failed:** `{fetch_data.get('tier1_feeds_failed', 0)}`",
                  f"- **Countries Updated / Fallback:** `{fetch_data.get('countries_updated', 0)}` / `{fetch_data.get('countries_fallback', 0)}`",
                  f"- **Alerts:** `{len(alerts)}`",
              ]
              if alerts:
                  lines.extend(["", "#### Circuit-Breaker & Staleness Alerts"])
                  for alert in alerts:
                      sev = _sanitize(str(alert.get("severity", "warning")).upper(), 32)
                      code = _sanitize(str(alert.get("code", "alert")), 64)
                      scope = _sanitize(str(alert.get("scope", "global")), 64)
                      detail = _sanitize(str(alert.get("detail", "")), 240)
                      lines.append(f"- **[{sev}] `{code}` (`{scope}`):** {detail}")
              with pathlib.Path(step_summary).open("a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          PY

      - name: Run Phase A diff-gated release build
        id: release
        run: |
          set -euo pipefail
          args=(
            --state state/published.json
            --prices-lock state/prices.lock.json
            --out-dir dist
            --changelogs-dir .
            --write-state
          )
          if [ "${FORCE_RUN:-false}" = "true" ]; then
            args+=(--force)
          fi
          uv run --offline ets2v2 publish release "${args[@]}"
          uv run --offline python - <<'PY'
          import json, os, pathlib

          summary = json.loads(pathlib.Path("dist/release_summary.json").read_text("utf-8"))
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"any_changed={str(summary['any_changed']).lower()}\n")
              fh.write(f"summer_changed={str(summary['summer_changed']).lower()}\n")
              fh.write(f"winter_changed={str(summary['winter_changed']).lower()}\n")
              fh.write(f"changed_editions={','.join(summary['changed_editions'])}\n")
              fh.write(f"force_run={str(summary['force_run']).lower()}\n")
          PY

      - name: Run explicit Offline SCS Workshop Validator checks
        run: |
          set -euo pipefail
          uv run --offline ets2v2 validate workshop dist/workshop/summer
          uv run --offline ets2v2 validate workshop dist/workshop/winter
          uv run --offline ets2v2 validate local dist/local/ETS2V2_Core_Summer.zip
          uv run --offline ets2v2 validate local dist/local/ETS2V2_Core_Winter.zip

      - name: Log clean no-op exit when nothing changed
        if: steps.release.outputs.any_changed != 'true' && env.FORCE_RUN != 'true' && steps.release.outputs.force_run != 'true'
        run: echo "No canonical content changes detected for Summer or Winter; exiting cleanly as no-op."

      - name: Upload validated Phase A release artifacts
        if: steps.release.outputs.any_changed == 'true' || env.FORCE_RUN == 'true' || steps.release.outputs.force_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-release-bundle
          if-no-files-found: ignore
          path: |
            dist/workshop
            dist/local
            dist/snapshots
            dist/fetch_summary.json
            dist/release_summary.json
            CHANGELOG_SUMMER.md
            CHANGELOG_WINTER.md

      - name: Create or update persistent Release PR
        if: steps.release.outputs.any_changed == 'true' && (github.event_name == 'schedule' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_EDITIONS: ${{ steps.release.outputs.changed_editions }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in state/published.json state/prices.lock.json CHANGELOG_SUMMER.md CHANGELOG_WINTER.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "No staged release ledger or changelog changes to commit."
            exit 0
          fi

          git commit -m "chore(release): phase A weekly update (${CHANGED_EDITIONS:-none})"
          git push --force origin HEAD:release/phase-a-weekly

          PR_TITLE="chore(release): Phase A weekly Core bundle update (${CHANGED_EDITIONS:-none})"
          PR_BODY=$(uv run --offline python - <<'PY'
          import json
          import pathlib

          lines = [
              "Automated Phase A semi-auto release update generated by `phase-a-release.yml`.",
              "",
              "### Maintainer Handoff Checklist (Manual SCS Workshop Uploader — AppID 421800)",
              "1. Download the `phase-a-release-bundle` workflow artifact from this run.",
              "2. Upload the validated `dist/workshop/summer/` and/or `dist/workshop/winter/` directories using **SCS Workshop Uploader**.",
              "3. Merge this persistent Release PR only **after** Workshop upload completes so `state/published.json` and `state/prices.lock.json` advance on `master`.",
          ]

          summary_path = pathlib.Path("dist/fetch_summary.json")
          if summary_path.is_file():
              def _sanitize(text: str, limit: int = 240) -> str:
                  cleaned = " ".join(text.split()).replace("`", "'").replace("<", "&lt;").replace(">", "&gt;")
                  return cleaned[:limit]

              fetch_data = json.loads(summary_path.read_text("utf-8"))
              alerts = fetch_data.get("alerts", [])
              if alerts:
                  lines.extend(["", "### Circuit-Breaker & Staleness Alerts"])
                  for alert in alerts:
                      sev = _sanitize(str(alert.get("severity", "warning")).upper(), 32)
                      code = _sanitize(str(alert.get("code", "alert")), 64)
                      scope = _sanitize(str(alert.get("scope", "global")), 64)
                      detail = _sanitize(str(alert.get("detail", "")), 240)
                      lines.append(f"- **[{sev}] `{code}` (`{scope}`):** {detail}")

          print("\n".join(lines))
          PY
          )

          EXISTING_PR=$(gh pr list --base master --head release/phase-a-weekly --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --base master --head release/phase-a-weekly --title "$PR_TITLE" --body "$PR_BODY"
          fi
